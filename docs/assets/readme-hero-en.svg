<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Context Map: see what fills your context window</title>
  <desc id="hero-desc">A dark hero with the Context Map title, a 200-cell context window map with four used cells, and a category breakdown for 21,201 of 1,000,000 tokens.</desc>

  <defs>
    <pattern id="free-grid" width="17" height="17" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" rx="3" fill="#1c2026" stroke="#6b7785" stroke-opacity="0.35"/>
    </pattern>
    <linearGradient id="cell-1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8fa8c8"/>
      <stop offset="0.663" stop-color="#8fa8c8"/>
      <stop offset="0.663" stop-color="#7fb8a8"/>
      <stop offset="1" stop-color="#7fb8a8"/>
    </linearGradient>
    <linearGradient id="cell-2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb8a8"/>
      <stop offset="0.986" stop-color="#7fb8a8"/>
      <stop offset="0.986" stop-color="#c8a878"/>
      <stop offset="0.991" stop-color="#c8a878"/>
      <stop offset="0.991" stop-color="#a898c8"/>
      <stop offset="1" stop-color="#a898c8"/>
    </linearGradient>
    <linearGradient id="cell-3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a898c8"/>
      <stop offset="0.216" stop-color="#a898c8"/>
      <stop offset="0.216" stop-color="#c88fa0"/>
      <stop offset="0.303" stop-color="#c88fa0"/>
      <stop offset="0.303" stop-color="#88b8c8"/>
      <stop offset="1" stop-color="#88b8c8"/>
    </linearGradient>
    <clipPath id="bar-clip">
      <rect x="720" y="126" width="404" height="10" rx="5"/>
    </clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="#0f1216" stroke="#232a33"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="56" y="92" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18" font-weight="600" letter-spacing="1.5" fill="#8fa8c8">OPENCHAMBER EXTENSION</text>
    <text x="56" y="156" font-size="56" font-weight="600" letter-spacing="-1" fill="#f2f5f8">See what fills</text>
    <text x="56" y="218" font-size="56" font-weight="600" letter-spacing="-1" fill="#f2f5f8">your context window.</text>
    <text x="56" y="258" font-size="22" fill="#aab4c0">A local panel for the last request: token budget,</text>
    <text x="56" y="290" font-size="22" fill="#aab4c0">category breakdown, and a 200-cell map.</text>
    <text x="56" y="338" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="18" fill="#7f8b99">OpenCode 2.2.2+  ·  OpenChamber 2.7.0+  ·  MIT</text>
  </g>

  <g id="proof-card" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="700" y="48" width="444" height="324" rx="16" fill="#1c2026" stroke="#2a323c"/>
    <text x="720" y="76" font-size="20" font-weight="600" fill="#e6ebf1">Context Map</text>
    <circle cx="1038" cy="70" r="3.5" fill="#8fbf8f"/>
    <text x="1124" y="76" text-anchor="end" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" fill="#7f8b99">last run</text>
    <text x="720" y="112" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="34" font-weight="600" fill="#f2f5f8">21,201</text>
    <text x="850" y="112" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="16" fill="#aab4c0">/ 1,000,000 tokens</text>
    <text x="1124" y="112" text-anchor="end" font-size="18" fill="#8fa8c8">2.1% used</text>

    <g clip-path="url(#bar-clip)">
      <rect x="720" y="126" width="168" height="10" fill="#8fa8c8"/>
      <rect x="888" y="126" width="133.6" height="10" fill="#7fb8a8"/>
      <rect x="1021.6" y="126" width="0.5" height="10" fill="#c8a878"/>
      <rect x="1022.1" y="126" width="22.7" height="10" fill="#a898c8"/>
      <rect x="1044.8" y="126" width="8.8" height="10" fill="#c88fa0"/>
      <rect x="1053.6" y="126" width="70.4" height="10" fill="#88b8c8"/>
    </g>

    <g transform="translate(753.5 150)">
      <rect width="337" height="167" fill="url(#free-grid)"/>
      <rect x="0" y="0" width="14" height="14" rx="3" fill="#8fa8c8"/>
      <rect x="17" y="0" width="14" height="14" rx="3" fill="url(#cell-1)"/>
      <rect x="34" y="0" width="14" height="14" rx="3" fill="url(#cell-2)"/>
      <rect x="51" y="0" width="14" height="14" rx="3" fill="url(#cell-3)"/>
    </g>

    <g font-size="18" fill="#aab4c0">
      <circle cx="724" cy="333" r="4" fill="#8fa8c8"/>
      <text x="736" y="337">System</text>
      <circle cx="825" cy="333" r="4" fill="#7fb8a8"/>
      <text x="837" y="337">Tools</text>
      <circle cx="926" cy="333" r="4" fill="#c8a878"/>
      <text x="938" y="337">User</text>
      <circle cx="1027" cy="333" r="4" fill="#a898c8"/>
      <text x="1039" y="337">Reasoning</text>
      <circle cx="724" cy="353" r="4" fill="#c88fa0"/>
      <text x="736" y="357">Calls</text>
      <circle cx="825" cy="353" r="4" fill="#88b8c8"/>
      <text x="837" y="357">Results</text>
      <circle cx="926" cy="353" r="4" fill="#6b7785"/>
      <text x="938" y="357">Free</text>
    </g>
  </g>
</svg>
